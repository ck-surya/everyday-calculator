name: Validate calculator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test calculator
        run: node --test tests/calculations.test.mjs
      - name: Validate release metadata
        env:
          SITE_URL: https://ck-surya.github.io/everyday-calculator
        run: |
          python3 scripts/build.py
          diff sitemap.xml _site/sitemap.xml
          diff robots.txt _site/robots.txt
